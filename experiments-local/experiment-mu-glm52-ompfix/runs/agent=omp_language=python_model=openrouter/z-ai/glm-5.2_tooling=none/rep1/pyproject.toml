[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "brazilian-soccer-mcp"
version = "2.0.0"
description = "MCP server providing a knowledge graph interface for Brazilian soccer data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=4.0",
]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer_mcp.server:main"

[tool.setuptools.packages.find]
include = ["brazilian_soccer_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
