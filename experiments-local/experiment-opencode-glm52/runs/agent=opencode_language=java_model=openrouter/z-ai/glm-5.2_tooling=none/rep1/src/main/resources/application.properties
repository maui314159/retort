# Use a file-based SQLite database by default. Override with env var.
spring.datasource.url=${BOOKS_DB_URL:jdbc:sqlite:books.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=sa
spring.datasource.password=

# SQLite only supports TRANSACTION_SERIALIZABLE in some configurations; keep simple.
spring.datasource.hikari.maximum-pool-size=1

# Avoid Hikari pool-name collisions; small embedded DB.
server.port=8080
