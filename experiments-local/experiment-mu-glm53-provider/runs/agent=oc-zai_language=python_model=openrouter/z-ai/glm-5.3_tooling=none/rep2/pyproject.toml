[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP server for querying Brazilian soccer datasets (matches, teams, players, competitions)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
brazilian-soccer-mcp = "main:main"

[tool.setuptools]
packages = ["brazilian_soccer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
