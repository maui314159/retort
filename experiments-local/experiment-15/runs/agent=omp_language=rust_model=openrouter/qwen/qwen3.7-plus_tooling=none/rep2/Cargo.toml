[package]
name = "book_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "uuid"] }
tower = { version = "0.4", features = ["util"] }

[dev-dependencies]
tower = "0.4"
http-body-util = "0.1"
