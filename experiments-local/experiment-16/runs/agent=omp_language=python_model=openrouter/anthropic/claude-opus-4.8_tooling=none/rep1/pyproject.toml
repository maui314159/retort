[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP knowledge-graph server for Brazilian soccer data"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-bdd>=7",
    "pytest-asyncio>=0.23",
]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer.server:main"

[tool.setuptools]
packages = ["brazilian_soccer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
