# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:./books.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=com.example.bookstore.config.CustomSQLiteDialect
spring.jpa.properties.hibernate.dialect=com.example.bookstore.config.CustomSQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080