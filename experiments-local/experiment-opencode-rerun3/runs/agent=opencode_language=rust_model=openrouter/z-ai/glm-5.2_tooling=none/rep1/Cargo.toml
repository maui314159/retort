[package]
name = "books-api"
version = "0.1.0"
edition = "2024"

[lib]
name = "books_api"
path = "src/lib.rs"

[[bin]]
name = "books-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"

# Force a statically bundled SQLite so the build does not depend on a
# system libsqlite3 (needed for `RETURNING ...` support and portability).
# The version must match the one sqlx 0.8 pulls in transit.
libsqlite3-sys = { version = "0.28", features = ["bundled"] }
