[package]
name = "books-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
http = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"

[lib]
name = "books_api"
path = "src/lib.rs"

[[bin]]
name = "books-api"
path = "src/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
