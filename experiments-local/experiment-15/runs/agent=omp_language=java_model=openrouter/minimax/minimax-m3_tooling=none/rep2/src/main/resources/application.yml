server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: books-api
  datasource:
    url: jdbc:sqlite:${BOOKS_DB:./data/books.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.example.books: INFO
