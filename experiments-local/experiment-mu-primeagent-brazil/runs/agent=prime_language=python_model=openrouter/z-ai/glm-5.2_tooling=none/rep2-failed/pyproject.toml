[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "2.0.0"
description = "MCP (Model Context Protocol) server exposing Brazilian soccer match, team, player and competition data from Kaggle datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Brazilian Soccer MCP" }]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "mcp>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-bdd>=7",
]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
