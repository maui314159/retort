[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP (Model Context Protocol) server exposing a knowledge graph of Brazilian soccer data (Brasileirão, Copa do Brasil, Libertadores, FIFA players)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brazilian Soccer MCP" }]
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["brazilian_soccer_mcp*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
