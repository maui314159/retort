[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP server exposing Brazilian soccer knowledge over Kaggle datasets"
requires-python = ">=3.10"
dependencies = ["mcp>=2.1"]

[project.scripts]
brazilian-soccer-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []

