# experiment-mu-kimi3-easy — kimi-k3 (released 2026-07) on the easy grid, opencode harness.
#
# Step 1 of the kimi-k3 evaluation: rest-api-crud x 5 languages x 3 reps = 15 runs,
# same grid as experiment-opencode-easy-final (glm-5.2), so kimi-k3 vs glm-5.2 is a
# direct head-to-head holding harness/task/languages constant. If this arm looks
# healthy, step 2 is brazil-bench (experiment-mu-kimi3-brazil).
# kimi-k3: 1M ctx, $3/$15 per Mtok on OpenRouter (~2.5x k2.7-code pricing).

experiment:
  name: exp-mu-kimi3-easy
  visibility: private

factors:
  language:
    levels: [python, go, typescript, rust, java]
  agent:
    levels: [opencode, omp]
  model:
    levels:
      - "openrouter/moonshotai/kimi-k3"
      - "openrouter/z-ai/glm-5.2"

responses:
  - code_quality
  - test_coverage
  - defect_rate
  - build_time
  - maintainability
  - token_efficiency

tasks:
  - source: bundled://rest-api-crud

playpen:
  runner: local
  replicates: 3
  timeout_minutes: 30
  # Kill a run that makes NO progress (no agent output, no workspace file
  # writes) for 25 min. The default is 0 = DISABLED; added 2026-08-02 after a
  # kimi3-brazil csharp cell hung mid-stream and burned its entire 120-min wall
  # producing nothing. timeout_minutes cannot tell a hang from slow work; this
  # can. 25 matches the modal value across the repo's other workspaces.
  stall_minutes: 25
  max_turns: 60
  local_agents:
    omp:
      harness: omp
    opencode:
      harness: opencode

design:
  screening_resolution: 3
  significance_threshold: 0.10

evaluation:
  enabled: false
