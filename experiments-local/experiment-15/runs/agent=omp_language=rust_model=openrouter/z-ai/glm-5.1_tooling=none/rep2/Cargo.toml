[package]
name = "book-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tower = "0.5"
http = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
