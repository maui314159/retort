[package]
name = "book-collection-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.16", features = ["derive"] }
tower = "0.5"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
testcontainers = "0.16"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate", "uuid"] }