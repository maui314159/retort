# SQLite file database (created next to the app on first run).
spring.datasource.url=${BOOK_DB_URL:jdbc:sqlite:books.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# SQLite serializes writes; keep the pool tiny to avoid "database is locked".
spring.datasource.hikari.maximum-pool-size=1

# Initialise / migrate the schema on every startup (idempotent).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Keep the embedded server on the default port.
server.port=${PORT:8080}
