[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "0.1.0"
description = "MCP server providing a knowledge graph interface for Brazilian soccer data."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brazilian_soccer_mcp*"]
