spring.application.name=book-api

# SQLite datasource — file-based so data persists across restarts.
spring.datasource.url=jdbc:sqlite:books.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Run schema.sql on every startup (idempotent CREATE TABLE IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

server.port=8080
