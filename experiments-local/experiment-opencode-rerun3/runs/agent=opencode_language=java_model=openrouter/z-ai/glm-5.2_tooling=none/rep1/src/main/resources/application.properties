spring.application.name=books-service

# SQLite datasource
spring.datasource.url=jdbc:sqlite:books.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Disable Spring's schema.sql auto-detection; we create the table in code
spring.sql.init.mode=never

# Keep HikariCP pool small for SQLite (file-based, single writer)
spring.datasource.hikari.maximum-pool-size=4

server.port=8080
