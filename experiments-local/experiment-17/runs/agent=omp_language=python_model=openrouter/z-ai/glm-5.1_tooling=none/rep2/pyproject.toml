[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP server for Brazilian soccer data (matches, teams, players, competitions)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
