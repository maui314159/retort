[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-soccer-mcp"
version = "2.0.0"
description = "MCP (Model Context Protocol) server providing a knowledge graph interface for Brazilian soccer data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brazilian Soccer MCP" }]
dependencies = [
    "mcp>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
neo4j = [
    "neo4j>=5.0",
]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "bdd: BDD Gherkin-style Given-When-Then scenarios",
]
