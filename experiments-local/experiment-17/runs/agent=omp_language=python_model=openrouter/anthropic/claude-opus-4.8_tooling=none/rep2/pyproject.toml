[project]
name = "brazilian-soccer-mcp"
version = "1.0.0"
description = "MCP server providing a queryable knowledge base over Brazilian soccer datasets"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
brazilian-soccer-mcp = "brazilian_soccer_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brazilian_soccer_mcp"]
